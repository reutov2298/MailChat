name: MailChat Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MailChat-Android-Project/MailChat

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Build APK
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ vars.GOOGLE_OAUTH_CLIENT_ID }}
        run: gradle assembleDebug

      - name: Verify APK package and version
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          BUILD_TOOLS="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)"
          AAPT="$ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt"
          BADGING="$("$AAPT" dump badging "$APK")"
          echo "$BADGING" | grep "name='ru.mailchat.app'"
          echo "$BADGING" | grep "versionCode='5' versionName='1.0.3'"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MC-1.0.3-debug
          path: MailChat-Android-Project/MailChat/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
