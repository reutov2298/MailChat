name: MailChat Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MailChat-Android-Project/MailChat
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Restore permanent signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Missing KEYSTORE_BASE64"; exit 1; }
          test -n "${{ secrets.KEYSTORE_PASSWORD }}" || { echo "Missing KEYSTORE_PASSWORD"; exit 1; }
          test -n "${{ secrets.KEY_ALIAS }}" || { echo "Missing KEY_ALIAS"; exit 1; }
          test -n "${{ secrets.KEY_PASSWORD }}" || { echo "Missing KEY_PASSWORD"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mc-release.jks"
          test -s "$RUNNER_TEMP/mc-release.jks"
          chmod 600 "$RUNNER_TEMP/mc-release.jks"
          echo "MC_KEYSTORE_PATH=$RUNNER_TEMP/mc-release.jks" >> "$GITHUB_ENV"

      - name: Build signed APK
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ vars.GOOGLE_OAUTH_CLIENT_ID }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleDebug

      - name: Verify APK identity and signature
        env:
          EXPECTED_CERT_SHA256: ${{ secrets.MC_CERT_SHA256 }}
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          apksigner verify --verbose "$APK"
          BUILD_TOOLS="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          BADGING="$("$ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt" dump badging "$APK")"
          echo "$BADGING" | grep -q "package: name='ru.mailchat.app' versionCode='6' versionName='1.0.4'"
          ACTUAL="$(apksigner verify --print-certs "$APK" | sed -n 's/.* certificate SHA-256 digest: //p' | head -1 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          test -n "$EXPECTED_CERT_SHA256" || { echo "Missing MC_CERT_SHA256"; exit 1; }
          EXPECTED="$(echo "$EXPECTED_CERT_SHA256" | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          test "$ACTUAL" = "$EXPECTED" || { echo "Signing certificate mismatch"; exit 1; }
          echo "APK identity and permanent signing certificate verified."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MC-1.0.4
          path: MailChat-Android-Project/MailChat/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
